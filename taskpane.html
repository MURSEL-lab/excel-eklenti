<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sheet Aktar v3</title>

    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>

    <link rel="stylesheet" href="https://static2.sharepointonline.com/files/fabric/office-ui-fabric-core/11.0.0/css/fabric.min.css" />
    <style>
        body { margin: 0; padding: 15px; font-family: 'Segoe UI', sans-serif; background-color: #fff; }
        h2 { font-size: 18px; margin-bottom: 10px; }
        #status { font-size: 13px; font-weight: bold; margin-bottom: 10px; color: blue; }
        #run-button { 
            padding: 12px 20px; background-color: #217346; color: white; 
            border: none; border-radius: 4px; cursor: pointer; width: 100%; font-weight: 500;
        }
        .update-container { margin-top: 20px; padding: 15px; border: 1px solid #e0e0e0; background-color: #fcfcfc; border-radius: 4px; }
        .timer-info { font-size: 11px; color: #888; margin-top: 5px; margin-left: 24px; }
    </style>
</head>

<body class="ms-font-m">
    <div>
        <h2>Sheet Aktar v3</h2>
        <div id="status">Durum: Hazır</div>
        <button id="run-button">Verileri Şimdi Getir</button>

        <div class="update-container">
            <input type="checkbox" id="auto-update-cb">
            <label for="auto-update-cb"><strong>Otomatik Güncelle</strong></label>
            <div id="timer-text" class="timer-info">Kapalı (İşaretlendiğinde 5 dk'da bir yeniler)</div>
        </div>
    </div>

    <script type="text/javascript" src="polyfill.js"></script>
    <script type="text/javascript" src="taskpane.js"></script>
</body>
</html>
